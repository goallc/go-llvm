name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        link: [dynamic, static]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: goallc/llvm-project
          ref: codex/goallc-static-library
          path: llvm-project
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Configure custom LLVM 23
        run: >
          cmake -S llvm-project/llvm -B llvm-build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLLVM_TARGETS_TO_BUILD=X86
          -DLLVM_BUILD_LLVM_DYLIB=ON
          -DLLVM_LINK_LLVM_DYLIB=ON
          -DLLVM_BUILD_GOALLC_STATIC=ON
          -DLLVM_INCLUDE_BENCHMARKS=OFF
          -DLLVM_INCLUDE_EXAMPLES=OFF
          -DLLVM_INCLUDE_TESTS=OFF
      - name: Build custom LLVM libraries
        run: cmake --build llvm-build --target LLVM LLVMGoALLC -j2
      - name: Assemble LLVM payload
        run: |
          mkdir -p llvm/include
          cp -R llvm-project/llvm/include/. llvm/include/
          cp -R llvm-build/include/. llvm/include/
          ln -s ../llvm-build/lib llvm/lib
      - name: Test bindings
        run: go test -v -tags="llvm23 ${{ matrix.link }}llvm" ./...
